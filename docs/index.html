<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home - before and after</title>
<meta name="description" content="LG's Home screen and TV Home on a webOS 10 TV, side by side: drag the divider.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0d0d10; color: #e8e8ec;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; font-weight: 650; margin: 0 0 6px; }
  p { margin: 0 0 22px; color: #a8a8b0; line-height: 1.5; }
  a { color: #7fb2ff; }
  .compare { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
    user-select: none; touch-action: pan-y; cursor: ew-resize; background: #000;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .compare .before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .divider { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px;
    background: #fff; box-shadow: 0 0 8px rgba(0, 0, 0, .5); pointer-events: none; }
  .handle { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
    display: grid; place-items: center; color: #28282c; font-size: 16px; letter-spacing: 6px; padding-left: 6px; box-sizing: border-box; }
  .label { position: absolute; bottom: 14px; padding: 6px 13px; border-radius: 999px; background: rgba(0, 0, 0, .7);
    font-size: 15px; font-weight: 600; pointer-events: none; }
  .label.left { left: 14px; } .label.right { right: 14px; }
  input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  input[type=range]:focus-visible + .divider .handle { outline: 3px solid #7fb2ff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>TV Home - before and after</h1>
  <p>LG's Home screen on webOS 10, and the same TV with
    <a href="https://github.com/lg-home-slideshow/lg-webos-tv-home">TV Home</a>. Drag the divider (or use the arrow keys).</p>
  <div class="compare" id="compare" style="--pos: 50%">
    <img class="after" src="after.jpg" alt="TV Home: a photo, the clock and a dock of apps">
    <img class="before" src="before.jpg" alt="LG's Home screen: banner, quick cards, app row and tips">
    <input type="range" min="0" max="100" value="50" step="0.5" aria-label="Divider between LG's Home and TV Home" id="slider">
    <div class="divider"><div class="handle" aria-hidden="true">&#9664;&#9654;</div></div>
    <span class="label left">LG's Home</span>
    <span class="label right">TV Home</span>
  </div>
</main>
<script>
  var box = document.getElementById('compare'), slider = document.getElementById('slider');
  slider.addEventListener('input', function () { box.style.setProperty('--pos', slider.value + '%'); });
</script>
</body>
</html>
